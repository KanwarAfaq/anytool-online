name: Official source monitor

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check official sources
        id: sources
        continue-on-error: true
        run: node scripts/source-monitor.mjs
      - name: Publish report
        if: always()
        run: |
          echo "## AnyTool official-source monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f source-monitor-report.json ]; then
            cat source-monitor-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open review issue when a source changed or failed
        if: steps.sources.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Official source review needed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="The daily source monitor detected an unavailable source or a missing expected marker. Review the workflow summary before changing any calculator or public-service rule. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
