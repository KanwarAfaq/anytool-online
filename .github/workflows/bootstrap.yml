name: Bootstrap AnyTool source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand production source
        run: |
          cat bootstrap/part* > anytool-source.b64
          base64 -d anytool-source.b64 > anytool-source.tgz
          tar -xzf anytool-source.tgz
          rm -rf bootstrap anytool-source.b64 anytool-source.tgz .github/workflows/bootstrap.yml
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://anytool.online
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "anytool-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build AnyTool.online production platform"
          git push origin HEAD:main
