name: Vendor playable arcade games into AnyTool
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-arcade.yml'

permissions:
  contents: write

concurrency:
  group: anytool-vendor-arcade
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy pinned official games runtime
        env:
          GAMES_COMMIT: e2b633385a3c6d2e89ea655fd16d227a500d168d
        run: |
          git clone --quiet --depth 1 https://github.com/KanwarAfaq/games.git .vendor-games
          git -C .vendor-games fetch --quiet --depth 1 origin "$GAMES_COMMIT"
          git -C .vendor-games checkout --quiet "$GAMES_COMMIT"
          node scripts/vendor-arcade.mjs .vendor-games
          test "$(find public/games -maxdepth 1 -name '*.html' | wc -l)" -eq 13
          test -f public/play/lumenfall/index.html
          test -f public/play/neon-velocity/index.html
          test -f public/play/starfall-protocol/index.html
          test -f public/assets/css/anytool-embed.css
          du -sh public/play public/assets public/games
          rm -rf .vendor-games
      - name: Commit game code and assets into AnyTool repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets public/play public/games public/arcade-manifest.json
          if git diff --cached --quiet; then
            echo 'Game assets already vendored'
            exit 0
          fi
          git commit -m 'feat(games): host all thirteen playable games and 3D engines within AnyTool'
          git push origin HEAD:main
